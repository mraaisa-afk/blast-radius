name: Blast Radius

on:
  pull_request:
    paths:
      - "models/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dbt manifest (for Jinja-safe column detection)
        run: |
          # dbt parse generates target/manifest.json without needing a warehouse
          # This allows blast_radius.py to use manifest.json instead of sqlglot parsing Jinja
          dbt parse --profiles-dir . || echo "[warn] dbt parse failed, falling back to sqlglot"
          ls -lh target/manifest.json || echo "manifest not found"

      - name: Detect changed model files
        id: changes
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'models/**' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run Blast Radius (with graceful mock mode)
        if: steps.changes.outputs.files != ''
        env:
          DATAHUB_URL: ${{ secrets.DATAHUB_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OWNER_MAPPING: ${{ secrets.OWNER_MAPPING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTIONS: "true"
          BASE_REF: origin/${{ github.base_ref }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.number }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "DATAHUB_URL set? $(if [ -z \"$DATAHUB_URL\" ]; then echo 'NO - will enter mock mode'; else echo 'YES'; fi)"
          python blast_radius.py --changed-files ${{ steps.changes.outputs.files }} --output report.md --manifest target/manifest.json --catalog target/catalog.json || echo "[warn] blast_radius.py failed but continuing to post report"
          cat report.md || echo "No report generated"
          # Ensure report.md exists even if script failed
          if [ ! -f report.md ]; then
            echo "### ⚠️ Blast Radius: Error" > report.md
            echo "" >> report.md
            echo "Agent failed to generate report. Check logs. Running in mock mode fallback." >> report.md
            echo "" >> report.md
            echo "Changed files: ${{ steps.changes.outputs.files }}" >> report.md
          fi

      - name: Post impact report on the PR
        if: steps.changes.outputs.files != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report.md
